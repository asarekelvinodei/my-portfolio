<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <title>Document viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#050810; --text:#f2f0ea; --muted:#9aa3b8; --line:rgba(255,255,255,.1); --glass:rgba(255,255,255,.055); --gold:#f0b45f; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body { display:flex; flex-direction:column; height:100dvh; overflow:hidden; background:radial-gradient(circle at 20% 0%,rgba(63,107,245,.16),transparent 28%),var(--bg); color:var(--text); font:500 15px/1.5 Arial,sans-serif; }
    .toolbar { flex:none; height:72px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:12px 24px; border-bottom:1px solid var(--line); background:rgba(5,8,16,.82); backdrop-filter:blur(18px); }
    .brand { min-width:0; text-align:center; }
    .brand strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; letter-spacing:.08em; text-transform:uppercase; }
    .brand span { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    .action { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:10px 16px; border:1px solid var(--line); border-radius:999px; background:var(--glass); color:var(--text); font-size:12px; font-weight:800; letter-spacing:.06em; text-decoration:none; text-transform:uppercase; transition:.2s; cursor:pointer; }
    .action:hover { border-color:var(--gold); transform:translateY(-1px); }
    .download { justify-self:end; border-color:transparent; background:linear-gradient(110deg,#3f6bf5,#a45bd4,#e0546f); }
    .viewer { flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:24px; }
    .pages { display:grid; width:min(100%, 1000px); gap:20px; margin:0 auto; }
    .page { width:100%; overflow:hidden; background:#fff; box-shadow:0 12px 38px rgba(0,0,0,.32); }
    .page canvas { display:block; width:100%; height:auto; }
    .status { width:min(100%, 1000px); margin:0 auto 16px; color:var(--muted); }
    .status.error { color:#ff8793; }
    .status[hidden] { display:none; }
    @media(max-width:640px) {
      .toolbar { height:64px; grid-template-columns:auto minmax(0,1fr) auto; padding:8px 10px; gap:7px; }
      .brand strong { max-width:38vw; font-size:11px; }
      .brand span { display:none; }
      .action { min-height:40px; padding:9px 10px; font-size:9.5px; }
      .viewer { padding:12px 8px 20px; }
      .pages { gap:12px; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <button class="action" id="back" type="button">← Back</button>
    <div class="brand">
      <strong id="title">Document</strong>
      <span id="page-count" aria-live="polite">Loading PDF…</span>
    </div>
    <a class="action download" id="download" download>Download PDF</a>
  </header>
  <main class="viewer" id="viewer" aria-label="PDF document pages">
    <p class="status" id="status" role="status" aria-live="polite">Loading document…</p>
    <div class="pages" id="pages"></div>
  </main>
  <script type="module" src="/src/document-viewer.js"></script>
</body>
</html>
