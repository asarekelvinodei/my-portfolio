<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#050810; --text:#f2f0ea; --muted:#9aa3b8; --line:rgba(255,255,255,.1); --glass:rgba(255,255,255,.055); --gold:#f0b45f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; background:radial-gradient(circle at 20% 0%,rgba(63,107,245,.16),transparent 28%),var(--bg); color:var(--text); font:500 15px/1.5 Arial,sans-serif; }
    .toolbar { height:72px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:12px 24px; border-bottom:1px solid var(--line); background:rgba(5,8,16,.82); backdrop-filter:blur(18px); }
    .brand { min-width:0; text-align:center; }
    .brand strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; letter-spacing:.08em; text-transform:uppercase; }
    .brand span { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    .action { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:10px 16px; border:1px solid var(--line); border-radius:999px; background:var(--glass); color:var(--text); font-size:12px; font-weight:800; letter-spacing:.06em; text-decoration:none; text-transform:uppercase; transition:.2s; }
    .action:hover { border-color:var(--gold); transform:translateY(-1px); }
    .download { justify-self:end; border-color:transparent; background:linear-gradient(110deg,#3f6bf5,#a45bd4,#e0546f); }
    .viewer { display:block; height:calc(100vh - 72px); height:calc(100dvh - 72px); min-height:480px; width:100%; border:0; background:#20242d; }
    .fallback { display:none; height:100%; place-items:center; padding:24px; text-align:center; color:var(--muted); }
    @media(max-width:640px) {
      .toolbar { height:64px; grid-template-columns:auto 1fr auto; padding:10px 12px; gap:8px; }
      .brand strong { max-width:38vw; font-size:12px; }
      .brand span { display:none; }
      .action { min-height:40px; padding:9px 11px; font-size:10.5px; }
      .viewer { height:calc(100vh - 64px); height:calc(100dvh - 64px); min-height:360px; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <button class="action" id="back" type="button">← Back</button>
    <div class="brand"><strong id="title">Document</strong><span>PDF document viewer</span></div>
    <a class="action download" id="download" download>Download PDF</a>
  </header>
  <iframe class="viewer" id="pdf" title="PDF document" scrolling="yes"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get('file') || 'My_CV.pdf';
    const title = params.get('title') || 'Document';
    const back = params.get('back') || '#top';
    const pdfUrl = '/' + encodeURIComponent(file);
    document.title = title;
    document.getElementById('title').textContent = title;
    document.getElementById('pdf').src = pdfUrl;
    const download = document.getElementById('download');
    download.href = pdfUrl;
    download.download = file;
    download.textContent = file === 'My_CV.pdf' ? 'Download CV' : title.toLowerCase().includes('thesis') ? 'Download thesis' : 'Download PDF';
    document.getElementById('back').addEventListener('click', () => {
      if (document.referrer && new URL(document.referrer).origin === location.origin) {
        history.length > 1 ? history.back() : location.href = '/' + back;
      } else {
        location.href = '/' + back;
      }
    });
  </script>
</body>
</html>
